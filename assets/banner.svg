<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anas Mahfouz - Junior Full Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2a47"/>
      <stop offset="1" stop-color="#1c1450"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7">
        <animate attributeName="stop-color" values="#36bcf7;#a78bfa;#36bcf7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#36bcf7;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="g1">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .float { animation: float 6s ease-in-out infinite; }
    .f2 { animation-delay: -2s; }
    .f3 { animation-delay: -4s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .sym { font-family: Consolas, 'Courier New', monospace; font-weight: 700; fill: #36bcf7; opacity: 0.35; }
    .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 64px; }
    .sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 24px; fill: #e2e8f0; }
    .tags { font-family: Consolas, 'Courier New', monospace; font-size: 16px; fill: #7dd3fc; letter-spacing: 1px; }
  </style>

  <rect width="1000" height="260" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="20" fill="url(#grid)"/>

  <circle cx="160" cy="60" r="170" fill="url(#g1)">
    <animate attributeName="cx" values="160;260;160" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="210" r="190" fill="url(#g2)">
    <animate attributeName="cx" values="860;760;860" dur="11s" repeatCount="indefinite"/>
  </circle>

  <text class="sym float" x="70" y="80" font-size="34">&lt;/&gt;</text>
  <text class="sym float f2" x="880" y="70" font-size="34">{ }</text>
  <text class="sym float f3" x="120" y="215" font-size="30">C#</text>
  <text class="sym float" x="850" y="215" font-size="30">SQL</text>
  <text class="sym float f2" x="930" y="140" font-size="26">.NET</text>
  <text class="sym float f3" x="35" y="150" font-size="26">JS</text>

  <text class="title" x="500" y="118" text-anchor="middle" fill="url(#txt)">Anas Mahfouz</text>
  <text class="sub" x="500" y="162" text-anchor="middle">Junior Full Stack Engineer</text>
  <text class="tags" x="500" y="200" text-anchor="middle">C#  •  ASP.NET Core  •  React  •  SQL Server</text>

  <rect x="440" y="222" width="120" height="4" rx="2" fill="url(#txt)">
    <animate attributeName="width" values="40;180;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="480;410;480" dur="4s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
